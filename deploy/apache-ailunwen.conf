# 犀材探索 · Apache 虚拟主机
# 安装：npm run install:prod
# __LAN_IP__、项目路径由 install-prod.sh 自动替换

<VirtualHost *:80>
    # 用 IP 访问时匹配局域网地址；有域名请改 ServerName 并 a2ensite 后 reload
    ServerName __LAN_IP__
    ServerAlias localhost 127.0.0.1 __PUBLIC_IP__

    DocumentRoot __ROOT__/dist-school

    <Directory __ROOT__/dist-school>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    # 后端 API（深度检索 / 作图可能较久）
    ProxyPass /api http://127.0.0.1:8787/api connectiontimeout=5 timeout=900
    ProxyPassReverse /api http://127.0.0.1:8787/api

    # 管理后台
    ProxyPass /admin http://127.0.0.1:8787/admin connectiontimeout=5 timeout=900
    ProxyPassReverse /admin http://127.0.0.1:8787/admin

    LimitRequestBody 33554432

    ErrorLog ${APACHE_LOG_DIR}/ailunwen-error.log
    CustomLog ${APACHE_LOG_DIR}/ailunwen-access.log combined
</VirtualHost>
