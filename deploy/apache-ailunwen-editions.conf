<VirtualHost *:80>
    ServerName __SCHOOL_DOMAIN__
    DocumentRoot __ROOT__/dist-school

    <Directory __ROOT__/dist-school>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /api http://127.0.0.1:8787/api connectiontimeout=5 timeout=900
    ProxyPassReverse /api http://127.0.0.1:8787/api
    ProxyPass /admin http://127.0.0.1:8787/admin connectiontimeout=5 timeout=900
    ProxyPassReverse /admin http://127.0.0.1:8787/admin
    LimitRequestBody 33554432

    ErrorLog ${APACHE_LOG_DIR}/ailunwen-school-error.log
    CustomLog ${APACHE_LOG_DIR}/ailunwen-school-access.log combined
</VirtualHost>

